# SafariModernizer 安全修正版：雲端 Mac 自動編譯
# 放在儲存庫的 .github/workflows/build.yml，存檔後會自動開始編譯
name: Build SafariModernizer (security fix)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 下載原作者原始碼（固定在已審查的版本）
        run: |
          git clone https://github.com/iamjhe08/SafariModernizer.git src
          cd src
          git checkout 7be8dc0d6fff6cf4e2eb8921309ef132ba851e79

      - name: 套用安全修正（每站獨立快取＋擋區網存取）
        run: |
          cd src
          echo "" | base64 --decode > ../fix.patch
          git apply ../fix.patch
          git diff --stat

      - name: 安裝編譯工具 Theos
        run: |
          brew install ldid dpkg make xz
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz | tar -xJ -C $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: 編譯（網頁端＋測試＋三種越獄的 deb）
        run: |
          cd src
          make --version | head -1
          ./build.sh

      - name: 上傳結果
        uses: actions/upload-artifact@v4
        with:
          name: SafariModernizer-securityfix
          path: src/tweak/packages/*.deb
